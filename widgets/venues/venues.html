<div class="venues-wrap">
    <aside class="venues-list">
        <div class="venues-list-header">
            <h2 class="venues-title">Venues</h2>
            <p class="venues-subtitle">Loading…</p>
            <p class="venues-hint">Tap and hold the map to drop a pin — venues will sort by distance.</p>
        </div>
        <div class="venues-pin-status" hidden>
            <span class="venues-pin-status-text">Sorted by distance from pin</span>
            <button type="button" class="venues-pin-clear">Clear</button>
        </div>
        <div class="venues-items"></div>
    </aside>
    <div class="venues-map"></div>
</div>
